# Runs the test suite on a clean Linux machine, builds the web page, and builds the Docker image.
name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python scripts/fetch_bsm1.py
      - run: python -m pytest -q
      - run: python -m aera.update_docs --check
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --prefix frontend
      - run: npm run build --prefix frontend
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t aera .
      - name: Container starts and serves the API
        run: |
          docker run -d --name aera -p 8061:8061 aera
          for i in $(seq 1 30); do curl -fs http://127.0.0.1:8061/docs >/dev/null && exit 0; sleep 2; done
          docker logs aera
          exit 1
